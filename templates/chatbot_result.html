<!DOCTYPE html>
<html>
<head>
    <title>SmartHire AI - Interview Result</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="container">

    <h1>SmartHire AI</h1>

    <h2>AI Interview Result</h2>

    <h3>Candidate: {{ candidate["name"] }}</h3>

    <div class="result">

        <h3>
            Interview Score: {{ interview_score }}/100
        </h3>

        <h2>
            {{ interview_status }}
        </h2>

        <p>
            The AI evaluated the candidate's responses
            based on teaching, communication, technology,
            student interaction and technical knowledge.
        </p>

    </div>

    <a href="/dashboard">
        <button>
            View Admin Dashboard
        </button>
    </a>

    <br>

    <a href="/">
        <button>
            Back to Home
        </button>
    </a>

</div>

</body>
</html>
